<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% if page.title and page.title != "" %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}">
  {% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | prepend: '/assets/css/' | append: '.css' | relative_url }}">{% endif %}
  <script src="{{ '/assets/js/research.js' | relative_url }}" defer></script>
</head>
<body class="research-site">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">Farhan Ishmam</a>
      <nav class="site-nav" aria-label="Main navigation">
        {% for link in site.data.navigation.main %}
        <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}{% if link.title == 'CV' %} <span aria-hidden="true">↗</span>{% endif %}</a>
        {% endfor %}
      </nav>
    </header>
    <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer"><span>Farhan Ishmam · University of Utah</span><a href="mailto:{{ site.author.email }}">Get in touch</a></footer>
  </div>
</body>
</html>
